# Nginx DENTRO del contenedor. El Nginx del VPS (con el certificado SSL)
# reenvía transversalab.com -> 127.0.0.1:8082 -> este servidor.
#
# La web es estática (HTML ya generado): cada URL existe como archivo o devuelve 404 de verdad.
# NO hay "vuelta a index.html" para todo (eso es lo que provoca los Soft 404 en Google).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: así no aparece http:// ni el puerto interno detrás del proxy
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # Página de error propia, servida con código 404
    error_page 404 /404.html;
    location = /404 { return 404; }
    location = /404.html {
        internal;
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    # 1. Archivos del build con hash en el nombre (JS, CSS, fuentes): caché de un año
    location /assets/ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 2. Imágenes e iconos (sin hash): caché de 30 días
    location ~* \.(avif|webp|png|jpe?g|svg|ico)$ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 3. Archivos ocultos (.git, .env...): nunca se sirven
    location ~ /\. {
        return 404;
    }

    # 4. Páginas: /aviso-legal -> aviso-legal.html. Si no existe -> 404 real.
    #    El HTML siempre "fresco" para que se vean los cambios nada más desplegar.
    location / {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
