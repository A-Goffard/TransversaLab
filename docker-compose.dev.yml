# Desarrollo con recarga en caliente dentro de Docker (alternativa a "npm run dev").
# Uso: docker compose -f docker-compose.dev.yml up   ->  http://localhost:5173
services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    container_name: transversalab_frontend_dev
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
